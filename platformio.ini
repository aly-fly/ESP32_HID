[platformio]
src_dir  = .\Firmware
include_dir = .\Firmware\include
data_dir = .\Flash_FS_data

; Set a path to a cache folder
build_dir = C:\PIO_BUILD
libdeps_dir = C:\PIO_LIBDEPS
; build_cache_dir = ~/.buildcache

boards_dir = .\Firmware ; custom board definition json file 

[env]
platform = espressif32@^7.0.1  ; latest: https://github.com/platformio/platform-espressif32/releases
framework = arduino

; https://www.espboards.dev/esp32/esp32-s3-super-mini/
; board     = esp32-s3-devkitm-1
; Exact hardware config for ESP32-S3 Super Mini
; board_build.mcu        = esp32s3
; board_build.f_cpu      = 240000000L
; board_build.flash_size = 4MB
; board_build.flash_mode = qio
; board_upload.flash_size = 4MB
board = esp32-s3-mini

board_build.partitions = .\Firmware\partition_OTA_4MB_app1,2MB_data_1,4MB.csv
board_build.filesystem = spiffs
upload_speed = 2000000  ; max speed on the integrated com port
; upload_port = COMxx
; monitor_port = COMxx
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes

build_flags =
	-D CORE_DEBUG_LEVEL=5	; Set to 0 for no debug; Set to 5 for full debug
	-Os ;
	; for Native USB HID
    -D ARDUINO_USB_MODE=0         ; 0 = JTAG serial port (USB-CDC) or 1 = (creates USBSerial)
    -D ARDUINO_USB_CDC_ON_BOOT=0  ; Virtual com port enabled
    -D ARDUINO_USB_HID_ON_BOOT=0  ; HID module activated
	-D ARDUINO_USB_MSC_ON_BOOT=0  ; Disable Mass Storage

lib_deps = 
	; SPI


 

extra_scripts = 
   .\Firmware\script_version_increment.py  ;  https://github.com/sblantipodi/platformio_version_increment

; ================================================================================================================================
; ================================================================================================================================
; ================================================================================================================================

[env:display_S3_RELEASE]
build_type = release
upload_protocol = esptool
upload_port = COM7  ; in the bootloader mode

; ================================================================================================================================
; ================================================================================================================================
; ================================================================================================================================

[env:display_S3_DEBUG]
build_type = debug

; https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitm-1.html

debug_tool = esp-builtin   ; debug using integrated JTAG device
upload_protocol = esp-builtin    ; use also for program upload
debug_init_break = tbreak setup  ; stop at the beginning of the program
debug_speed = 20000   ; clock frequency kHz


